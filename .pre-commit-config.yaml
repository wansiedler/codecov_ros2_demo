# Local gate that mirrors the CI lint job: install with `pre-commit install`.
# Run over the whole tree once with `pre-commit run --all-files`.
---
# A plain `pre-commit install` only wires the pre-commit stage, so the message
# and push checks below would sit in the config and never run. Listing them here
# makes one install command set up all three.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-yaml
      - id: check-xml
      - id: destroyed-symlinks

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: ["--style=file"]

  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint
        args:
          - --linelength=100
          - --filter=-build/c++11,-build/header_guard,-build/include_order,-runtime/references,-whitespace/braces,-whitespace/indent,-whitespace/newline,-whitespace/parens

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-lint
        args: ["--line-width=100", "--disabled-codes", "C0103", "C0113"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words-list=ba,inout,nd"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
      - id: check-dependabot

  # Enforces Conventional Commits, which is what feeds the changelog and the
  # release-please version bumps.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
      # Checks the whole range being pushed, which is what the CI job does on the
      # pull request. Catches a commit that arrived by another route - a rebase,
      # a cherry-pick, or a bot writing straight into the branch.
      - id: commitizen-branch
        stages: [pre-push]
        args: [--rev-range, origin/main..HEAD]

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        description: Static analysis of the C++ sources.
        entry: cppcheck
        language: system
        types: [c++]
        exclude: '^src/nav_utils/test/'
        args:
          - --quiet
          - --error-exitcode=1
          - --enable=warning,style,performance,portability
          - --inline-suppr
          - --suppress=missingIncludeSystem
          - --suppress=unusedFunction
          # Members are used from other translation units, which this
          # per-file invocation cannot see.
          - --suppress=unusedStructMember
          # Must track CMAKE_CXX_STANDARD in src/nav_utils/CMakeLists.txt:
          # parsing C++23 sources as C++17 hides real findings.
          - --std=c++23
          - --language=c++
          - -Isrc/nav_utils/include
