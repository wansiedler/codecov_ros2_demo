sonar.projectKey=wansiedler_codecov_ros2_demo
sonar.organization=wansiedler

sonar.sources=src/nav_utils/src,src/nav_utils/include
sonar.tests=src/nav_utils/test
sonar.sourceEncoding=UTF-8

sonar.host.url=https://sonarcloud.io

# The compilation database and the gcov reports are produced by the CI job and
# passed on the command line, so their paths stay in one place.

# The ClusterFuzzLite image only exists to compile fuzz targets: it derives from
# gcr.io/oss-fuzz-base/base-builder, which builds as root by design, and a
# Dockerfile comment cannot carry NOSONAR on an instruction line.
sonar.exclusions=.clusterfuzzlite/**

# sonar.exclusions does not reach the Dockerfile rules: SonarCloud analyses
# infrastructure files regardless of sonar.sources. The root user belongs to the
# upstream OSS-Fuzz base image, which writes to $SRC and $OUT as root, and a
# Dockerfile instruction line cannot carry a NOSONAR marker - so the rule is
# turned off for that path specifically.
sonar.issue.ignore.multicriteria=fuzzimage
sonar.issue.ignore.multicriteria.fuzzimage.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.fuzzimage.resourceKey=.clusterfuzzlite/**
