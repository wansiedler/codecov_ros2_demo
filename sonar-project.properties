sonar.projectKey=wansiedler_codecov_ros2_demo
sonar.organization=wansiedler

sonar.sources=src/nav_utils/src,src/nav_utils/include
sonar.tests=src/nav_utils/test
sonar.sourceEncoding=UTF-8

sonar.host.url=https://sonarcloud.io

# The compilation database and the gcov reports are produced by the CI job and
# passed on the command line, so their paths stay in one place.

# The ClusterFuzzLite image only exists to compile fuzz targets: it derives from
# gcr.io/oss-fuzz-base/base-builder, which builds as root by design, and a
# Dockerfile comment cannot carry NOSONAR on an instruction line.
sonar.exclusions=.clusterfuzzlite/**
