---
name: ROS workspace
description: >
  Installs the build toolchain and the package dependencies inside a ros image.
  Every job that builds this workspace repeated the same three steps; this keeps
  them in one place, which is what makes the setup portable to another repo.

inputs:
  packages:
    description: Extra apt packages this job needs on top of the toolchain.
    required: false
    default: ''
  compiler:
    description: gcc or clang. Selects the toolchain and exports CC and CXX.
    required: false
    default: gcc

runs:
  using: composite
  steps:
    - name: Install the toolchain
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.packages }}
        COMPILER: ${{ inputs.compiler }}
      run: |
        toolchain="build-essential cmake git python3-colcon-common-extensions"
        if [ "$COMPILER" = "clang" ]; then
          toolchain="$toolchain clang"
        fi
        apt-get update
        # shellcheck disable=SC2086
        apt-get install -y --no-install-recommends $toolchain $EXTRA_PACKAGES
        rm -rf /var/lib/apt/lists/*

    - name: Select the compiler
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
      run: |
        if [ "$COMPILER" = "clang" ]; then
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
        else
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"
        fi

    # rosdep update pulls the distribution index from raw.githubusercontent.com
    # on every job. With several pull requests in flight that is dozens of hits a
    # minute from one runner pool, and GitHub answers 429 - which failed jobs
    # that had nothing wrong with them. The cache removes most of the traffic and
    # the retry rides out the rest.
    - name: Cache the rosdep index
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.ros/rosdep
        key: rosdep-${{ runner.os }}-${{ github.run_id }}
        restore-keys: rosdep-${{ runner.os }}-

    - name: Install the ROS dependencies
      shell: bash
      run: |
        for attempt in 1 2 3 4 5; do
          if rosdep update; then
            break
          fi
          if [ "$attempt" = 5 ]; then
            echo "rosdep update failed five times" >&2
            exit 1
          fi
          delay=$((attempt * 15))
          echo "rosdep update failed, retrying in ${delay}s" >&2
          sleep "$delay"
        done
        rosdep install --from-paths src --ignore-src -y
