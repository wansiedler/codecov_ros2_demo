---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      # One pull request for the routine bumps instead of one per action.
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    # Wait a week before proposing a freshly published version: a compromised
    # release is usually pulled well inside that window.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # Dependabot parses .pre-commit-config.yaml and follows each hook's rev, which
  # is otherwise only refreshed by running `pre-commit autoupdate` by hand.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # The two base images are pinned by digest, which is what makes the build
  # reproducible - and what makes it stale without something to move the pin.
  - package-ecosystem: docker
    directories:
      - /.github/docker
      - /.clusterfuzzlite
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # The tool versions are hash pinned, so a new release only arrives as a
  # reviewable change; nothing else updates them.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    groups:
      python-tools:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
