---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      # One pull request for the routine bumps instead of one per action.
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    # Wait a week before proposing a freshly published version: a compromised
    # release is usually pulled well inside that window.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # Dependabot parses .pre-commit-config.yaml and follows each hook's rev, which
  # is otherwise only refreshed by running `pre-commit autoupdate` by hand.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
