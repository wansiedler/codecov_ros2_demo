---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Deny everything by default; each job grants only what it needs.
permissions: {}

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: "2G"
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime

# A newer push supersedes the previous run on the same ref, but never cancels a
# scheduled or manually dispatched run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  image:
    name: resolve the CI image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: pick
        uses: ./.github/actions/ci-image

  build-test-coverage:
    name: build + test + coverage
    runs-on: ubuntu-latest
    needs: image
    container:
      # Which tag this is, and why, is decided by the image job.
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/ros-workspace
        with:
          packages: lcov ccache

      - name: Cache compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coverage-${{ github.sha }}
          restore-keys: |
            ccache-coverage-
            ccache-

      - name: Build, test and collect coverage
        shell: bash
        env:
          CMAKE_ARGS: >-
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        # The log is kept for the report job: the coverage build prints the
        # compiler warnings the -Werror builds would have turned into errors.
        run: |
          set -o pipefail
          make coverage 2>&1 | tee build.log

      # Everything the report job reads: the lcov tracefile, the build log and
      # the JUnit XML. Uploaded even when the tests failed - that is exactly
      # when the report is worth reading.
      - name: Upload the CI report inputs
        if: always() && !env.ACT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-report-inputs
          path: |
            coverage.info
            build.log
            build/nav_utils/test_results/**/*.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Upload the browsable HTML report
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-html
          path: coverage_html
          retention-days: 30

      - name: Upload the JUnit test results
        # act cannot inject node into a job container, so the Node based
        # artifact actions only run on GitHub. env.ACT is set by act.
        if: always() && !env.ACT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results
          path: build/nav_utils/test_results/**/*.xml
          retention-days: 30
          if-no-files-found: warn

      # A run Dependabot triggers sees only the Dependabot secrets, and a run
      # from a fork sees none, so neither has the token - and Codecov refuses
      # a tokenless upload from a branch of this repository. Skipping is the
      # honest outcome there; a token that is present and wrong still fails
      # the job below.
      - name: Check whether the Codecov token is available
        id: codecov
        if: ${{ !env.ACT }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no CODECOV_TOKEN in this run (Dependabot and fork runs get none) - Codecov uploads skipped"
          fi

      - name: Upload coverage to Codecov
        if: ${{ !env.ACT && steps.codecov.outputs.enabled == 'true' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.info
          # Upload exactly the lcov report: without this the uploader rescans
          # the workspace and picks up gcov data of system and gtest headers.
          disable_search: true
          plugins: noop
          flags: unittests
          name: nav_utils
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload the test results to Codecov
        if: always() && !env.ACT && steps.codecov.outputs.enabled == 'true'
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1
        with:
          files: build/nav_utils/test_results/nav_utils/*.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  compilers:
    name: build with ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    needs: image
    container:
      # Which tag this is, and why, is decided by the image job.
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    permissions:
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/ros-workspace
        with:
          compiler: ${{ matrix.compiler }}

      - name: Build with warnings as errors
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DWARNINGS_AS_ERRORS=ON

      - name: Run tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+ --ctest-args -R "^test_"
          colcon test-result --verbose

  future-standard:
    name: C++26 canary
    runs-on: ubuntu-latest
    needs: image
    container:
      # Which tag this is, and why, is decided by the image job.
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    permissions:
      packages: read
      contents: read
    # Never blocks: it reports what a future toolchain would say, the way the
    # Rolling distribution reports what the next ROS release will say. GCC 13 in
    # this image has no -std=c++2c at all, so the canary brings its own gcc-14.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/ros-workspace
        with:
          packages: gcc-14 g++-14

      # The step environment wins over the CC and CXX the setup exported.
      - name: Build as C++26
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
          CMAKE_ARGS: -DCMAKE_CXX_STANDARD=26
        run: make build

  report:
    name: CI report
    # Always runs, after every job it reports on, so a red build still gets
    # its report: the failing cases, the coverage that was collected before
    # the failure, and which job broke.
    needs: [build-test-coverage, compilers, future-standard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read         # artifacts of this run and of the baseline run
      pull-requests: write  # the sticky comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Fetch the inputs, the baseline and the job verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # fetch <out> <api path>: three attempts, so one 5xx or a secondary
          # rate limit does not turn into a report with no sections.
          fetch() {
            local out=$1 path=$2 n
            for n in 1 2 3; do
              if gh api "$path" > "$out" 2> fetch.err; then return 0; fi
              [ "$n" -lt 3 ] && sleep $((n * 10))
            done
            echo "::warning::could not fetch $path: $(tr '\n' ' ' < fetch.err | cut -c1-300)"
            return 1
          }
          artifact_id() {  # <run id> <artifact name>
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"$2\") | .id" 2>/dev/null | head -n 1
          }
          mkdir -p inputs baseline
          id=$(artifact_id "$RUN_ID" ci-report-inputs || true)
          if [ -n "$id" ]; then
            fetch inputs.zip "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              && unzip -o -q inputs.zip -d inputs || true
          else
            echo "::warning::no ci-report-inputs artifact in this run - the build job did not get that far"
          fi
          # Baseline for the deltas: the last successful run of this workflow
          # on the default branch. Best effort - a miss only drops the deltas.
          base_run=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$DEFAULT_BRANCH&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
          if [ -n "$base_run" ]; then
            bid=$(artifact_id "$base_run" ci-metrics || true)
            if [ -n "$bid" ]; then
              fetch baseline.zip "repos/$GITHUB_REPOSITORY/actions/artifacts/$bid/zip" \
                && unzip -o -q baseline.zip -d baseline || true
            fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | {name, conclusion, steps: [.steps[] | select(.conclusion == "failure") | .name]}]' \
            > jobs.json || echo '[]' > jobs.json

      - name: Compose the report, post it to the Summary and the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The build job ran inside the container, so the paths in the lcov
          # tracefile and the build log start with its workspace, not this one.
          BUILD_WORKSPACE: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # A push to a branch with an open pull request still refreshes the
          # comment: resolve the number from the commit.
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls?per_page=1" \
              --jq '.[0].number // empty' 2>/dev/null || true)
            export PR_NUMBER
          fi
          python3 scripts/ci_report.py \
            --junit inputs \
            --lcov inputs/coverage.info \
            --build-log inputs/build.log \
            --workspace "$BUILD_WORKSPACE" \
            --jobs jobs.json \
            --baseline baseline/report.json \
            --metrics-out ci-metrics/report.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --post

      # The next run on any branch compares against this file once it comes
      # from a successful run on the default branch.
      - name: Upload the metrics for the next run's deltas
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-metrics
          path: ci-metrics/
          retention-days: 90

  publish-coverage-page:
    name: publish coverage to Pages
    needs: build-test-coverage
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-html
          path: coverage_html
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: coverage_html

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
