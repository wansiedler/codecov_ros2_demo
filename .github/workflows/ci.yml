---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: "2G"
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime

# A newer push supersedes the previous run on the same ref, but never cancels a
# scheduled or manually dispatched run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-test-coverage:
    name: build + test + coverage
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build and coverage tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git lcov ccache \
            python3-colcon-common-extensions
          rm -rf /var/lib/apt/lists/*

      - name: Cache compiled objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coverage-${{ github.sha }}
          restore-keys: |
            ccache-coverage-
            ccache-

      - name: Install ROS dependencies
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build with gcov instrumentation
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache --show-stats || true

      - name: Run tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+ --ctest-args -R "^test_"
          colcon test-result --verbose

      - name: Collect coverage
        run: |
          IGNORE=mismatch,gcov,unused,empty,negative
          # Baseline from the .gcno files: without it, a source file that no
          # test ever executes has no .gcda and would silently disappear from
          # the report instead of showing up as 0 % covered.
          lcov --capture --initial --directory build --output-file coverage.base \
            --ignore-errors "$IGNORE" --rc branch_coverage=1
          lcov --capture --directory build --output-file coverage.run \
            --ignore-errors "$IGNORE" --rc branch_coverage=1
          lcov --add-tracefile coverage.base --add-tracefile coverage.run \
            --output-file coverage.info --ignore-errors "$IGNORE" --rc branch_coverage=1
          # Keep only our own sources: no system headers, no gtest, no test code.
          lcov --extract coverage.info "$GITHUB_WORKSPACE/src/*" \
            --output-file coverage.info --ignore-errors unused --rc branch_coverage=1
          lcov --remove coverage.info "*/test/*" \
            --output-file coverage.info --ignore-errors unused --rc branch_coverage=1
          lcov --list coverage.info --rc branch_coverage=1
          genhtml coverage.info --branch-coverage --legend \
            --title "nav_utils @ ${GITHUB_SHA}" --output-directory coverage_html \
            --ignore-errors inconsistent,corrupt

      - name: Upload the browsable HTML report
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-html
          path: coverage_html
          retention-days: 30

      - name: Upload the JUnit test results
        # act cannot inject node into a job container, so the Node based
        # artifact actions only run on GitHub. env.ACT is set by act.
        if: always() && !env.ACT
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results
          path: build/nav_utils/test_results/**/*.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5
        with:
          files: ./coverage.info
          # Upload exactly the lcov report: without this the uploader rescans
          # the workspace and picks up gcov data of system and gtest headers.
          disable_search: true
          plugins: noop
          flags: unittests
          name: nav_utils
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload the test results to Codecov
        if: always()
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1
        with:
          files: build/nav_utils/test_results/nav_utils/*.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  publish-coverage-page:
    name: publish coverage to Pages
    needs: build-test-coverage
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: coverage-html
          path: coverage_html
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: coverage_html

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
