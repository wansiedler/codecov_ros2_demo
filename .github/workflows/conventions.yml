---
name: Conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # commitizen validates the whole PR range

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install commitizen
        run: pip install "commitizen==4.1.0"

      - name: Check every commit against Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cz check --rev-range "$BASE_SHA..$HEAD_SHA"

  pull-request-title:
    name: pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # The squash-merge commit takes its subject from the PR title, so the
      # title has to satisfy the same convention as the commits.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
