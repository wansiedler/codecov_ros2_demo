---
name: Conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch: {}

# Deny everything by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: conventions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # commitizen validates the whole PR range

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install commitizen
        run: pip install --require-hashes -r requirements/commitizen.txt

      - name: Check every commit against Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cz check --rev-range "$BASE_SHA..$HEAD_SHA"

  pull-request-title:
    name: pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The squash-merge commit takes its subject from the PR title, so the
      # title has to satisfy the same convention as the commits.
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825  # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
