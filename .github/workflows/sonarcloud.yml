---
name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Deny everything by default; each job grants only what it needs.
permissions: {}

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  image:
    name: resolve the CI image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: pick
        uses: ./.github/actions/ci-image

  sonarcloud:
    name: analysis
    runs-on: ubuntu-latest
    needs: image
    container:
      # Which tag this is, and why, is decided by the image job.
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # Sonar needs the history for new-code detection

      - name: Check whether the analysis is configured
        id: config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up the workspace
        if: steps.config.outputs.enabled == 'true'
        uses: ./.github/actions/ros-workspace
        with:
          packages: curl unzip lcov valgrind

      # The C++ analyser reads the compile_commands.json that the build step
      # below requests via -DCMAKE_EXPORT_COMPILE_COMMANDS=ON, so only the
      # scanner CLI is needed - no build wrapper.
      - name: Install the Sonar scanner
        if: steps.config.outputs.enabled == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSLo /tmp/scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q /tmp/scanner.zip -d /opt
          echo "/opt/sonar-scanner-6.2.1.4610-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Build, test and produce gcov reports
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          colcon test --ctest-args -R "^test_"
          # Sonar reads .gcov text reports rather than the lcov tracefile.
          mkdir -p gcov
          find build -name '*.gcda' -exec gcov -p -b {} + > /dev/null
          mv ./*.gcov gcov/ 2>/dev/null || true
          find gcov -name '*.gcov' | head

      - name: Run memcheck for the Valgrind issue import
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p memcheck
          for test_binary in build/nav_utils/test_*; do
            [ -x "$test_binary" ] || continue
            name=$(basename "$test_binary")
            # No --error-exitcode here: a leak must show up as a Sonar issue,
            # not kill the analysis before it is uploaded. The Runtime analysis
            # workflow is the gate that fails the build on memory errors.
            valgrind --tool=memcheck --leak-check=full \
              --show-leak-kinds=definite,indirect --track-origins=yes \
              --xml=yes --xml-file="memcheck/$name.xml" "$test_binary" || true
          done
          find memcheck -name '*.xml' | head

      - name: Run the analysis
        if: steps.config.outputs.enabled == 'true'
        # PIPESTATUS is a bash builtin; container steps default to sh.
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +e
          # Valgrind Memcheck reports are imported as external issues, so the
          # runtime findings land next to the static ones in the same project.
          valgrind_reports=$(find memcheck -name '*.xml' | paste -sd, -)
          sonar-scanner \
            -Dsonar.cfamily.compile-commands=build/nav_utils/compile_commands.json \
            -Dsonar.cfamily.gcov.reportsPath=gcov \
            -Dsonar.cfamily.valgrind.reportsPaths="$valgrind_reports" 2>&1 | tee scanner.log
          code=${PIPESTATUS[0]}
          set -e
          # SonarCloud refuses a CI analysis while its own Automatic Analysis is
          # switched on. That is a project setting, not something this workflow
          # can change, so report it as a warning instead of a red check and let
          # every other scanner error keep failing the job.
          if [ "$code" -ne 0 ] && grep -q "Automatic Analysis is enabled" scanner.log; then
            {
              echo "### SonarCloud analysis skipped"
              echo
              echo "The project still has **Automatic Analysis** enabled, which cannot"
              echo "coexist with a CI analysis. Turn it off under"
              echo "*Administration -> Analysis Method* to get C++ analysis and coverage:"
              echo
              echo "<https://sonarcloud.io/project/analysis_method?id=wansiedler_codecov_ros2_demo>"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::SonarCloud Automatic Analysis is enabled; CI analysis skipped."
            exit 0
          fi
          exit "$code"

      - name: Explain the skip
        if: steps.config.outputs.enabled != 'true'
        run: |
          echo "SONAR_TOKEN is not configured - create the project on sonarcloud.io" >> "$GITHUB_STEP_SUMMARY"
          echo "and add the token as a repository secret to enable this job." >> "$GITHUB_STEP_SUMMARY"
