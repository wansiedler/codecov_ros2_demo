---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install tools used by the local hooks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      # Pinned to the same version the pre-commit hook uses, so local and CI
      # formatting never disagree over a compiler release.
      - name: Install clang-format
        run: 'pip install --only-binary=:all: "clang-format==22.1.8"'
      - name: Check formatting
        run: |
          find src \( -name '*.cpp' -o -name '*.hpp' \) \
            -exec clang-format --dry-run --Werror {} +

  ament-linters:
    name: ament linters
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install linters
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git cppcheck \
            python3-colcon-common-extensions \
            ros-jazzy-ament-cmake-copyright \
            ros-jazzy-ament-cmake-cppcheck \
            ros-jazzy-ament-cmake-cpplint \
            ros-jazzy-ament-cmake-lint-cmake \
            ros-jazzy-ament-cmake-xmllint
          rm -rf /var/lib/apt/lists/*

      - name: Install ROS dependencies
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+

      - name: Run style, licence and static analysis checks
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+ \
            --ctest-args -R "copyright|cppcheck|cpplint|lint_cmake|xmllint"
          colcon test-result --verbose

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install clang-tidy
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git clang-tidy python3-colcon-common-extensions
          rm -rf /var/lib/apt/lists/*

      - name: Install ROS dependencies
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build to generate compile_commands.json
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Analyse the package sources
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          run-clang-tidy -p build/nav_utils -quiet "$(pwd)/src/nav_utils/src/.*\.cpp"
