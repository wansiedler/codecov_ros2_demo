---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Deny everything by default; each job grants only what it needs.
permissions: {}

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install tools used by the local hooks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      # Pinned to the same version the pre-commit hook uses, so local and CI
      # formatting never disagree over a compiler release.
      - name: Install clang-format
        run: 'pip install --only-binary=:all: --require-hashes -r requirements/clang-format.txt'
      - name: Check formatting
        run: |
          find src \( -name '*.cpp' -o -name '*.hpp' \) \
            -exec clang-format --dry-run --Werror {} +

  ament-linters:
    name: ament linters
    runs-on: ubuntu-latest
    container:
      # A pull request runs against the image its own CI image run just
      # published, so a change to the recipe is exercised by the jobs that
      # consume it. main - and a fork, which cannot push a tag - use the tag
      # main publishes. The first push of a recipe change races the image
      # build; rerun those jobs once it has finished.
      image: >-
        ghcr.io/${{ github.repository }}/ci:${{
        (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.fork != true)
        && format('pr-{0}', github.event.pull_request.number)
        || 'jazzy' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/ros-workspace
        with:
          packages: >-
            cppcheck
            ros-jazzy-ament-cmake-copyright
            ros-jazzy-ament-cmake-cppcheck
            ros-jazzy-ament-cmake-cpplint
            ros-jazzy-ament-cmake-lint-cmake
            ros-jazzy-ament-cmake-xmllint

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+

      - name: Run style, licence and static analysis checks
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+ \
            --ctest-args -R "copyright|cppcheck|cpplint|lint_cmake|xmllint"
          colcon test-result --verbose

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    container:
      # A pull request runs against the image its own CI image run just
      # published, so a change to the recipe is exercised by the jobs that
      # consume it. main - and a fork, which cannot push a tag - use the tag
      # main publishes. The first push of a recipe change races the image
      # build; rerun those jobs once it has finished.
      image: >-
        ghcr.io/${{ github.repository }}/ci:${{
        (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.fork != true)
        && format('pr-{0}', github.event.pull_request.number)
        || 'jazzy' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/ros-workspace
        with:
          packages: clang-tidy

      - name: Analyse the package sources
        shell: bash
        run: make tidy
