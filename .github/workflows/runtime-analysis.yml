---
name: Runtime analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 3 * * *'   # nightly: valgrind and callgrind are too slow per push
  workflow_dispatch: {}

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan + ubsan
            sanitize: address,undefined
          - name: tsan
            sanitize: thread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git python3-colcon-common-extensions
          rm -rf /var/lib/apt/lists/*

      - name: Install ROS dependencies
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build instrumented binaries
        shell: bash
        env:
          SANITIZE: ${{ matrix.sanitize }}
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Debug "-DSANITIZE=$SANITIZE"

      - name: Run tests under the sanitizer
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+ --packages-select nav_utils \
            --ctest-args -R "^test_"
          colcon test-result --verbose

  valgrind:
    name: valgrind memcheck
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install valgrind
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git valgrind python3-colcon-common-extensions
          rm -rf /var/lib/apt/lists/*

      - name: Install ROS dependencies
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Debug

      - name: Run the unit tests under memcheck
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p memcheck
          status=0
          for test_binary in build/nav_utils/test_*; do
            [ -x "$test_binary" ] || continue
            name=$(basename "$test_binary")
            echo "::group::valgrind $name"
            valgrind --tool=memcheck --leak-check=full --show-leak-kinds=definite,indirect \
              --track-origins=yes --error-exitcode=42 \
              --xml=yes --xml-file="memcheck/$name.xml" "$test_binary" || status=$?
            echo "::endgroup::"
          done
          exit $status

      - name: Upload the memcheck reports
        # act cannot inject node into a job container, so the Node based
        # artifact actions only run on GitHub. env.ACT is set by act.
        if: always() && !env.ACT
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: valgrind-memcheck
          path: memcheck
          retention-days: 30

  callgrind:
    name: callgrind profile
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install valgrind and the graph tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git valgrind graphviz python3-pip \
            python3-colcon-common-extensions
          pip3 install --break-system-packages --only-binary=:all: "gprof2dot==2025.4.14"
          rm -rf /var/lib/apt/lists/*

      - name: Install ROS dependencies
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Profile the unit tests and render call graphs
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p callgrind
          for test_binary in build/nav_utils/test_*; do
            [ -x "$test_binary" ] || continue
            name=$(basename "$test_binary")
            valgrind --tool=callgrind --callgrind-out-file="callgrind/$name.out" "$test_binary"
            gprof2dot --format=callgrind --output="callgrind/$name.dot" "callgrind/$name.out"
            dot -Tsvg "callgrind/$name.dot" -o "callgrind/$name.svg"
          done

      - name: Upload the profiles
        # act cannot inject node into a job container, so the Node based
        # artifact actions only run on GitHub. env.ACT is set by act.
        if: always() && !env.ACT
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: callgrind-profiles
          path: callgrind
          retention-days: 30
