---
name: Runtime analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 3 * * *'   # nightly: valgrind and callgrind are too slow per push
  workflow_dispatch: {}

# Deny everything by default; each job grants only what it needs.
permissions: {}

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      # A pull request runs against the image its own CI image run just
      # published, so a change to the recipe is exercised by the jobs that
      # consume it. main - and a fork, which cannot push a tag - use the tag
      # main publishes. The first push of a recipe change races the image
      # build; rerun those jobs once it has finished.
      image: >-
        ghcr.io/${{ github.repository }}/ci:${{
        (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.fork != true)
        && format('pr-{0}', github.event.pull_request.number)
        || 'jazzy' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    permissions:
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan + ubsan
            sanitize: address,undefined
          - name: tsan
            sanitize: thread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/ros-workspace

      - name: Build and test under the sanitizer
        shell: bash
        env:
          SANITIZE: ${{ matrix.sanitize }}
        run: make sanitize

  valgrind:
    name: valgrind memcheck
    runs-on: ubuntu-latest
    container:
      # A pull request runs against the image its own CI image run just
      # published, so a change to the recipe is exercised by the jobs that
      # consume it. main - and a fork, which cannot push a tag - use the tag
      # main publishes. The first push of a recipe change races the image
      # build; rerun those jobs once it has finished.
      image: >-
        ghcr.io/${{ github.repository }}/ci:${{
        (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.fork != true)
        && format('pr-{0}', github.event.pull_request.number)
        || 'jazzy' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/ros-workspace
        with:
          packages: valgrind

      - name: Run the unit tests under memcheck
        shell: bash
        run: make memcheck

      - name: Upload the memcheck reports
        # act cannot inject node into a job container, so the Node based
        # artifact actions only run on GitHub. env.ACT is set by act.
        if: always() && !env.ACT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: valgrind-memcheck
          path: memcheck
          retention-days: 30

  callgrind:
    name: callgrind profile
    runs-on: ubuntu-latest
    container:
      # A pull request runs against the image its own CI image run just
      # published, so a change to the recipe is exercised by the jobs that
      # consume it. main - and a fork, which cannot push a tag - use the tag
      # main publishes. The first push of a recipe change races the image
      # build; rerun those jobs once it has finished.
      image: >-
        ghcr.io/${{ github.repository }}/ci:${{
        (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.fork != true)
        && format('pr-{0}', github.event.pull_request.number)
        || 'jazzy' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/ros-workspace
        with:
          packages: valgrind graphviz python3-pip

      - name: Install the graph tooling
        run: |
          pip3 install --break-system-packages --only-binary=:all: --require-hashes \
            -r requirements/gprof2dot.txt

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Profile the unit tests and render call graphs
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p callgrind
          for test_binary in build/nav_utils/test_*; do
            [ -x "$test_binary" ] || continue
            name=$(basename "$test_binary")
            valgrind --tool=callgrind --callgrind-out-file="callgrind/$name.out" "$test_binary"
            gprof2dot --format=callgrind --output="callgrind/$name.dot" "callgrind/$name.out"
            dot -Tsvg "callgrind/$name.dot" -o "callgrind/$name.svg"
          done

      - name: Upload the profiles
        # act cannot inject node into a job container, so the Node based
        # artifact actions only run on GitHub. env.ACT is set by act.
        if: always() && !env.ACT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: callgrind-profiles
          path: callgrind
          retention-days: 30
