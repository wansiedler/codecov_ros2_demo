---
# Kept in its own file on purpose: the publishing endpoint rejects results that
# come from a workflow with global env vars or defaults, which the Security
# workflow has. See https://github.com/ossf/scorecard-action#workflow-restrictions
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch: {}

permissions: {}

jobs:
  analysis:
    # Needs the GitHub API, so it only makes sense on GitHub; under act it would
    # retry until the run looks stuck. The env context is not available in a
    # job-level condition, so this keys on the actor act reports instead.
    if: github.actor != 'nektos/act'
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write   # signs the published results

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
