---
name: Security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 4 * * 1'   # weekly, so new advisories surface without a push
  workflow_dispatch: {}

# Deny everything by default; each job grants only what it needs.
permissions: {}

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  image:
    # A draft is work in progress: this waits until the pull request is marked
    # ready (ready_for_review above starts it then), and every job that needs
    # this one waits with it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: resolve the CI image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: pick
        uses: ./.github/actions/ci-image

  codeql:
    # Needs the GitHub API, so it only makes sense on GitHub; under act it would
    # retry until the run looks stuck. The env context is not available in a
    # job-level condition, so this keys on the actor act reports instead.
    if: github.actor != 'nektos/act'
    name: CodeQL (c-cpp)
    runs-on: ubuntu-latest
    needs: image
    container:
      # Which tag this is, and why, is decided by the image job.
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    permissions:
      packages: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/ros-workspace

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        shell: bash
        run: make build

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: /language:c-cpp

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans the whole history, not just the tip

      - name: Install gitleaks
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan repository and history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  filesystem-scan:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scan for vulnerabilities, secrets and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Publish results to the Security tab
        if: ${{ !env.ACT }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    needs: image
    container:
      image: semgrep/semgrep:1.173.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scan with the community rule sets
        run: |
          # An in-source `nosemgrep` still ships the finding in the SARIF, only
          # marked suppressed, and code scanning ignores that marking for third
          # party uploads - the alert stays open. Dropping the rule here is what
          # actually keeps it out. The one exclusion is the defusedxml rule: it
          # is about untrusted documents, and the only parse in this repository
          # reads valgrind reports the same script just produced.
          semgrep scan --config p/default --config p/c --config p/secrets \
            --config p/github-actions \
            --exclude-rule python.lang.security.use-defused-xml-parse.use-defused-xml-parse \
            --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected \
            --sarif --output semgrep.sarif

      - name: Publish results to the Security tab
        if: always() && !env.ACT
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  osv-scanner:
    name: OSV scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scan the sources for known vulnerabilities
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          sudo install /tmp/osv-scanner /usr/local/bin/osv-scanner
          # Exit 0 means nothing found and 1 means findings, both reported
          # through SARIF; 128 means no supported manifest exists, which is the
          # normal case for a pure C++ workspace. Anything else is a failure.
          set +e
          osv-scanner scan source --recursive --format sarif --output osv.sarif .
          code=$?
          set -e
          # An empty runs array is rejected by the SARIF upload API, so fall
          # back to a single run with no results.
          [ -s osv.sarif ] || cat > osv.sarif <<'SARIF'
          {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [
              {"tool": {"driver": {"name": "osv-scanner", "rules": []}}, "results": []}
            ]
          }
          SARIF
          case "$code" in
            0 | 1 | 128) exit 0 ;;
            *) exit "$code" ;;
          esac

      - name: Publish results to the Security tab
        if: always() && !env.ACT
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  sbom:
    # Needs the GitHub API, so it only makes sense on GitHub; under act it would
    # retry until the run looks stuck. The env context is not available in a
    # job-level condition, so this keys on the actor act reports instead.
    if: github.actor != 'nektos/act'
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # the dependency snapshot is written to the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Generate an SPDX SBOM and submit the dependency snapshot
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: nav_utils.spdx.json
          dependency-snapshot: true

  zizmor:
    # Needs the GitHub API for the upload, so it only makes sense on GitHub
    # (see codeql above).
    if: github.actor != 'nektos/act'
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read   # the SARIF upload reads the workflow run it belongs to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Audits the workflows and the composite actions themselves, which no
      # other scanner here reads: unpinned actions, template injection through
      # an expression in a run block, a credential the checkout left behind,
      # a permission no step uses. Informational for now - the findings go to
      # the Security tab and the job Summary, and .github/zizmor.yml records
      # the ones that are accepted. Drop --no-exit-codes to make it a gate.
      - name: Audit the workflows
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the online audits read the advisory database
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace \
            --env GH_TOKEN \
            ghcr.io/zizmorcore/zizmor:1.29.0@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284 \
            --persona=regular --format=sarif --no-exit-codes -- . > zizmor.sarif
          count=$(jq '[.runs[].results[]] | length' zizmor.sarif)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            if [ "$count" -eq 0 ]; then
              echo "## ✅ zizmor: clean"
            else
              echo "## ⚠️ zizmor: $count finding(s), informational"
              echo ""
              echo "| rule | location | message |"
              echo "| --- | --- | --- |"
              jq -r '[.runs[].results[]][0:60][]
                     | .locations[0].physicalLocation as $at
                     | (.message.text | gsub("[|\n]"; " ") | .[0:120]) as $text
                     | "| \(.ruleId) | \($at.artifactLocation.uri):\($at.region.startLine // "?") | \($text) |"' \
                zizmor.sarif
              echo ""
              echo "_The same findings, with the fix each one suggests: Security → Code scanning, tool zizmor._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results to the Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: zizmor.sarif
          category: zizmor
