---
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny everything by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a release in flight

jobs:
  release-please:
    # Needs the GitHub API, so it only makes sense on GitHub; under act it would
    # retry until the run looks stuck. The env context is not available in a
    # job-level condition, so this keys on the actor act reports instead.
    if: github.actor != 'nektos/act'
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Reads the Conventional Commits since the last tag, maintains a release
      # pull request with the generated CHANGELOG, and tags on merge.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4
        with:
          release-type: simple
          package-name: nav_utils
