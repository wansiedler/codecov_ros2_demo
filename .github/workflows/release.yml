---
name: Release

on:
  push:
    branches:
      - main
      # A release candidate line: the same pipeline, prerelease versions.
      - 'release/**'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to (re)build the artifacts for, e.g.
          nav_utils-v1.0.0. Skips release-please; for a release whose
          artifact jobs failed.
        type: string
        default: ''

# Deny everything by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a release in flight

jobs:
  release-please:
    # Needs the GitHub API, so it only makes sense on GitHub; under act it would
    # retry until the run looks stuck. The env context is not available in a
    # job-level condition, so this keys on the actor act reports instead.
    if: github.actor != 'nektos/act'
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Reads the Conventional Commits since the last tag, maintains a release
      # pull request with the generated CHANGELOG and the version bumps, and
      # tags on merge. release-please-config.json says which files carry the
      # version (package.xml among them) and .release-please-manifest.json
      # records the last version released. A `release/**` branch runs the same
      # pipeline with the rc config: prerelease versions, prerelease flag on the
      # GitHub release. To force a version, put `Release-As: 1.2.3` in a commit
      # footer on the branch; the action has no input for it in manifest mode.
      - id: release
        if: inputs.tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          target-branch: ${{ github.ref_name }}
          config-file: >-
            ${{ startsWith(github.ref_name, 'release/')
                && '.github/release-please-rc.json'
                || 'release-please-config.json' }}
          manifest-file: .release-please-manifest.json
    # With a tag given by hand the release-please step is skipped and the
    # outputs carry the tag through, so the artifact jobs run for an
    # existing release.
    outputs:
      created: ${{ steps.release.outputs.release_created == 'true' || inputs.tag != '' }}
      tag: ${{ inputs.tag || steps.release.outputs.tag_name }}

  # The toolchain the release is built with. `jazzy` is a moving tag - the
  # weekly image rebuild moves it - so the digest it resolves to right now is
  # retagged with the version and signed. Whoever rebuilds v1.2.3 later gets
  # the compiler, lcov and rosdep set that built it, not what `jazzy` has
  # become since. The image's provenance was attested when ci-image.yml built
  # it; the attestation is on the digest, so it covers the new tag too.
  image:
    name: release image tag
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write  # push the tag and the signature
      id-token: write  # the OIDC token cosign signs with
    env:
      IMAGE: ghcr.io/${{ github.repository }}/ci
      TAG: ${{ needs.release-please.outputs.tag }}
    outputs:
      ref: ${{ steps.retag.outputs.ref }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag the current jazzy image with the version
        id: retag
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:jazzy" \
            --format '{{.Manifest.Digest}}')
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$digest"
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$TAG -> $digest"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless, like the assets: the signature names this workflow's OIDC
      # identity and is stored in the registry next to the image.
      - name: Sign the image
        env:
          REF: ${{ steps.retag.outputs.ref }}
        run: cosign sign --yes "$REF"

  # The Debian package, built in the image just retagged so that the binary
  # is produced by the toolchain CI tested with. bloom writes the packaging
  # from package.xml, whose version the release pull request bumped, so the
  # .deb carries the tag's number; `make deb` is the same command locally.
  deb:
    name: debian package
    needs: [release-please, image]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    container:
      # The digest the image job resolved, not the tag it moved.
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      # Not in the CI image: nothing but a release needs them, and the image
      # is pulled by every job of every run.
      # rosdep's cache is baked into the image under /root/.ros, but a
      # container job runs with HOME=/github/home, where bloom finds no
      # sources ("rosdep database does not have any sources"). Point it at
      # the baked cache rather than fetch it again.
      - name: Install the packaging tools
        env:
          ROS_HOME: /root/.ros
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-bloom fakeroot debhelper dh-python dpkg-dev
          rm -rf /var/lib/apt/lists/*

      - name: Build the package
        env:
          ROS_HOME: /root/.ros
        run: make deb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deb
          path: src/*.deb
          retention-days: 1
          if-no-files-found: error

  # Runs once per release, on the merge of the release pull request: packs the
  # sources at the tag, adds the Debian package, generates the SBOM and gives
  # it its first reader, signs every asset keylessly with cosign (Sigstore,
  # the workflow's OIDC identity) and attaches SLSA build provenance, then
  # uploads all of it to the release. What a consumer gets is a tarball and a
  # .deb whose origin can be verified with
  #   cosign verify-blob --bundle <asset>.sigstore.json <asset> \
  #     --certificate-identity-regexp '^https://github.com/wansiedler/perfect_ros2_atomic_package/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  #   gh attestation verify <asset> --repo wansiedler/perfect_ros2_atomic_package
  # - and the verify job below runs exactly those commands before the release
  # is declared done.
  assets:
    name: signed release assets
    needs: [release-please, deb]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # upload the assets to the release
      id-token: write      # the OIDC token cosign and the attestation sign with
      attestations: write  # store the provenance in the repository
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - name: Pack the sources at the tag
        run: |
          # nav_utils-v1.0.0 -> nav_utils-1.0.0 (a bare v1.0.0 works too)
          version="${TAG##*-v}"
          name="nav_utils-${version#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" "$TAG"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Add the Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: deb
          path: dist

      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/${{ env.NAME }}.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - uses: ./.github/actions/osv-scanner

      # An SBOM nobody reads is a file. This is its first reader: the
      # dependencies it lists, against the OSV database, in the run Summary.
      # Informational here - a known CVE in a dependency is a reason to ship
      # the fix as the next release, not to leave this one half uploaded.
      # housekeeping.yml rescans the SBOM of the last release every night, so
      # a CVE published later still surfaces against the version people run.
      - name: Scan the SBOM for known vulnerabilities
        run: |
          set +e
          osv-scanner scan source --lockfile "dist/${NAME}.spdx.json" \
            --format markdown --output-file osv.md
          code=$?
          set -e
          {
            echo "## 🔎 OSV scan of ${NAME}.spdx.json"
            echo
            cat osv.md
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 is clean and 1 is findings, both already in the Summary.
          case "$code" in
            0 | 1) exit 0 ;;
            *) exit "$code" ;;
          esac

      - name: Write the checksums
        working-directory: dist
        run: sha256sum ./* > "${NAME}.sha256sums"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless: the signature is bound to this workflow's OIDC identity and
      # recorded in the Rekor transparency log; there is no key to leak.
      - name: Sign every asset
        working-directory: dist
        run: |
          for asset in *; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
          done

      # SLSA build provenance: which workflow, at which commit, produced which
      # bytes. Stored in the repository's attestation store and, as a bundle
      # next to the assets, where the Scorecard Signed-Releases check reads it.
      - name: Attest the build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.spdx.json
            dist/*.deb

      - name: Upload everything to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/${NAME}.intoto.jsonl"
          gh release upload "$TAG" dist/* --clobber
          {
            echo "## 📦 ${TAG}: $(find dist -type f | wc -l) signed asset(s)"
            echo ""
            echo '```'
            find dist -type f -printf '%f\n' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Trust, then verify. A clean runner downloads what was just published and
  # checks it the way a consumer would: the checksums, every cosign bundle
  # against this repository's workflow identity, the provenance through the
  # attestation API, the image signature and its provenance. Signing that is
  # never verified is a ritual; a release whose assets fail this job is red,
  # not shipped in silence.
  verify:
    name: verify the release
    needs: [release-please, image, assets]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      IMAGE: ghcr.io/${{ github.repository }}/ci
      # Only this repository's workflows may have signed; the regexp is what
      # the README tells a consumer to pass.
      IDENTITY: ^${{ github.server_url }}/${{ github.repository }}/
      ISSUER: https://token.actions.githubusercontent.com
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Download the release assets
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets

      - name: Verify the checksums
        working-directory: assets
        run: sha256sum -c ./*.sha256sums

      - name: Verify every signature
        working-directory: assets
        run: |
          for bundle in *.sigstore.json; do
            cosign verify-blob --bundle "$bundle" "${bundle%.sigstore.json}" \
              --certificate-identity-regexp "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER"
          done

      - name: Verify the provenance
        working-directory: assets
        run: |
          for asset in *.tar.gz *.spdx.json *.deb; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done

      - name: Verify the image
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign verify "$IMAGE:$TAG" \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" > /dev/null
          gh attestation verify "oci://$IMAGE:$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Report
        run: |
          {
            echo "## ✅ ${TAG} verified"
            echo
            echo "Checksums, $(find assets -name '*.sigstore.json' | wc -l) signatures," \
              "the provenance of every artifact and the image \`$IMAGE:$TAG\`" \
              "check out against \`$IDENTITY\`."
          } >> "$GITHUB_STEP_SUMMARY"
