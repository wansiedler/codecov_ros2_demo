---
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny everything by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a release in flight

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Reads the Conventional Commits since the last tag, maintains a release
      # pull request with the generated CHANGELOG, and tags on merge.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          release-type: simple
          package-name: nav_utils
