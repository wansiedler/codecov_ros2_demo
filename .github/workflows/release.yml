---
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny everything by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a release in flight

jobs:
  release-please:
    # Needs the GitHub API, so it only makes sense on GitHub; under act it would
    # retry until the run looks stuck. The env context is not available in a
    # job-level condition, so this keys on the actor act reports instead.
    if: github.actor != 'nektos/act'
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Reads the Conventional Commits since the last tag, maintains a release
      # pull request with the generated CHANGELOG, and tags on merge.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          release-type: simple
          package-name: nav_utils
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

  # Runs once per release, on the merge of the release pull request: packs the
  # sources at the tag, generates the SBOM, signs every asset keylessly with
  # cosign (Sigstore, the workflow's OIDC identity) and attaches SLSA build
  # provenance, then uploads all of it to the release. What a consumer gets is
  # a tarball whose origin can be verified with
  #   cosign verify-blob --bundle <asset>.sigstore.json <asset> \
  #     --certificate-identity-regexp '^https://github.com/wansiedler/perfect_ros2_atomic_package/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  #   gh attestation verify <asset> --repo wansiedler/perfect_ros2_atomic_package
  assets:
    name: signed release assets
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # upload the assets to the release
      id-token: write      # the OIDC token cosign and the attestation sign with
      attestations: write  # store the provenance in the repository
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - name: Pack the sources at the tag
        run: |
          name="nav_utils-${TAG#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" "$TAG"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/${{ env.NAME }}.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Write the checksums
        working-directory: dist
        run: sha256sum ./* > "${NAME}.sha256sums"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless: the signature is bound to this workflow's OIDC identity and
      # recorded in the Rekor transparency log; there is no key to leak.
      - name: Sign every asset
        working-directory: dist
        run: |
          for asset in *; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
          done

      # SLSA build provenance: which workflow, at which commit, produced which
      # bytes. Stored in the repository's attestation store and, as a bundle
      # next to the assets, where the Scorecard Signed-Releases check reads it.
      - name: Attest the build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.spdx.json

      - name: Upload everything to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/${NAME}.intoto.jsonl"
          gh release upload "$TAG" dist/* --clobber
          {
            echo "## 📦 ${TAG}: $(ls dist | wc -l) signed asset(s)"
            echo ""
            echo '```'
            ls -1 dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
